# Builds the site and publishes it to GitHub Pages on every push to main.
#
# This is the no-server version: no sign-in and no secrets. The studio works in
# the browser and downloads an updated data file, which is uploaded to
# public/data/ to go live. Uploading that file is itself a push to main, so it
# triggers this workflow and the dashboard updates a minute or two later.
#
# One-time setup in the repository: Settings, then Pages, then under "Build and
# deployment" set Source to "GitHub Actions".
#
# The Cloudflare Pages version (with GitHub sign-in and a publish button) is
# built from the same code without these variables. See docs/setup-guide.md.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Refuses to deploy a data file the studio would reject, so a bad upload
      # leaves the previous version of the site live instead of breaking it.
      - name: Check the data file and run the tests
        run: npm run test:run

      - name: Build the static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_MODE: '1'
          VITE_REPOSITORY: ${{ github.repository }}
          VITE_BRANCH: ${{ github.ref_name }}

      # GitHub Pages has no rewrite rules. Serving the app as the 404 page
      # makes deep links such as /admin/historical load the app, which then
      # reads the path and shows the right screen.
      - name: Add the deep-link fallback
        run: cp dist/index.html dist/404.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
