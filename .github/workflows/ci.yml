# Typecheck, test and build on every push and pull request.
#
# This workflow does not deploy. Cloudflare Pages is connected to this
# repository through its own GitHub integration and builds each push to the
# production branch itself, which is also what makes the Publish button work:
# the admin studio commits the data file, and Cloudflare picks the commit up.
#
# Keeping deployment out of here is deliberate. The publish endpoint writes
# only to public/data/, and a workflow that could deploy would be a second,
# unnecessary path to production.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck the app, the Functions and the tests
        run: npm run typecheck

      - name: Run the test suite
        run: npm run test:run

      - name: Build
        run: npm run build
